    margin-top: 6px;
    opacity: 0.8;
  }

  #mindmap-container {
    width: 100%;

    padding: 20px 0 40px;
    display: flex;
    justify-content: center;
  }

  svg#mm {
    display: block;
    overflow: visible;
  }

  .node-center circle { fill: #1b5e20; stroke: #69f0ae; stroke-width: 3; filter: drop-shadow(0 0 16px #00e67688); }
  .node-center text   { fill: #ccff90; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }

  .node-main text     { fill: #e8f5e9; font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }

  .node-sub rect      { fill: #1a3d1a; stroke: #4caf50; stroke-width: 1.5; rx: 10; cursor: pointer; transition: all .25s; }
  .node-sub:hover rect { fill: #2e7d32; filter: drop-shadow(0 0 10px #69f0ae88); }
  .node-sub text      { fill: #c8e6c9; font-size: 11px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }

  .node-leaf rect     { fill: #0f2710; stroke: #388e3c; stroke-width: 1; rx: 8; cursor: pointer; transition: all .25s; }
  .node-leaf:hover rect { fill: #1b5e20; filter: drop-shadow(0 0 8px #4caf5066); }
  .node-leaf text     { fill: #a5d6a7; font-size: 10px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }

  /* edges */
  .edge-main { stroke: #388e3c; stroke-width: 2.5; fill: none; opacity: 0.7; }
  .edge-sub  { stroke: #2e7d32; stroke-width: 1.8; fill: none; opacity: 0.6; }
  .edge-leaf { stroke: #1b5e20; stroke-width: 1.2; fill: none; opacity: 0.5; }

  #info-panel {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(90vw, 680px);
    max-height: 85vh;
    overflow-y: auto;
    background: linear-gradient(145deg, #0a1f0a, #142814);
    border: 2px solid #4caf50;
    border-radius: 18px;
    padding: 32px 28px 24px;
    z-index: 1000;
    box-shadow: 0 0 60px #00e67644, 0 8px 40px #000c;

    color: #69f0ae;
    font-size: 1.5rem;
    margin-bottom: 14px;
    border-bottom: 1px solid #2e7d32;
    padding-bottom: 10px;

  #info-panel .panel-body {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  #info-panel .panel-img {
    flex: 0 0 200px;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid #388e3c;
    background: #0d2b0d;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 160px;

    width: 180px;
    height: 150px;
  }

  #info-panel .panel-text {
    flex: 1 1 280px;
    color: #c8e6c9;
    line-height: 1.65;
    font-size: .95rem;
  }

  #info-panel .panel-text ul {
    padding-left: 18px;
    margin-top: 8px;
  }

  #info-panel .panel-text li {
    margin-bottom: 6px;
  }

  #info-panel .panel-text strong {
    color: #69f0ae;
  }

    display: inline-block;
    background: #1b5e20;
    color: #a5d6a7;
    font-size: .8rem;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid #4caf50;
    margin: 4px 4px 0 0;
  }

  #close-btn {
    position: absolute; top: 14px; right: 16px;
    background: none; border: 2px solid #4caf50;
    color: #69f0ae; font-size: 1.3rem; cursor: pointer;
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  #close-btn:hover { background: #2e7d32; }

  #overlay {
    display: none;
    position: fixed; inset: 0;
    background: #00000088;
    z-index: 999;
    backdrop-filter: blur(4px);
  }

  #legend {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 12px; padding: 12px 20px 30px;
  }

    display: flex; align-items: center; gap: 8px;
    color: #81c784; font-size: .85rem;
  }

  .legend-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid currentColor;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0a1f0a; }
  ::-webkit-scrollbar-thumb { background: #2e7d32; border-radius: 4px; }
</style>

/* =========================================================
   LAYOUT CALCULATION
   ========================================================= */
const DEG = Math.PI / 180;
const W = 1400, H = 1100;

function pos(cx, cy, angle, dist) {
  return { x: cx + Math.cos(angle * DEG) * dist, y: cy + Math.sin(angle * DEG) * dist };
}

// Compute positions
const mainDist = 270;
const mainPositions = {};
MAIN_NODES.forEach(n => {
  const p = pos(0, 0, n.angle, mainDist);
  mainPositions[n.id] = { x: p.x, y: p.y, angle: n.angle };
});

const subPositions = {};
SUB_NODES.forEach(n => {
  const parent = mainPositions[n.parent];
  const p = pos(parent.x, parent.y, n.angle, n.dist);
  subPositions[n.id] = { x: p.x, y: p.y };
});

const leafPositions = {};
LEAF_NODES.forEach(n => {
  const parent = subPositions[n.parent];
  const p = pos(parent.x, parent.y, n.angle, n.dist);
  leafPositions[n.id] = { x: p.x, y: p.y };
});

/* =========================================================
   SVG RENDERING
   ========================================================= */
const svg = document.getElementById('mm');

function mkEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

function cubicPath(x1, y1, x2, y2) {
  const dx = (x2 - x1) * 0.45;
  return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
}

function drawEdge(x1, y1, x2, y2, cls) {
  svg.insertBefore(mkEl('path', { d: cubicPath(x1, y1, x2, y2), class: cls }), svg.firstChild);
}

function wrapText(svgEl, text, x, y, fs, color) {
  const lines = text.split('\n');
  const lineH = fs * 1.25;
  const startY = y - (lines.length - 1) * lineH / 2;
  lines.forEach((line, i) => {
    const t = mkEl('text', { x, y: startY + i * lineH, fill: color, 'font-size': fs, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'pointer-events': 'none' });
    t.textContent = line;
    svgEl.appendChild(t);
  });
}

function drawCenterNode() {
  const g = mkEl('g', { class: 'node-center', cursor: 'pointer' });
  g.addEventListener('click', () => openPanel('root'));

  // Outer glow ring
  g.appendChild(mkEl('circle', { cx: 0, cy: 0, r: 85, fill: 'none', stroke: '#69f0ae', 'stroke-width': '1', opacity: '0.3' }));
  g.appendChild(mkEl('circle', { cx: 0, cy: 0, r: CENTER.r, fill: '#1b5e20', stroke: '#69f0ae', 'stroke-width': '3' }));

  // Leaf icon
  const leaf = mkEl('path', { d: 'M0,-30 Q25,-10 20,20 Q0,35 -20,20 Q-25,-10 0,-30Z', fill: '#69f0ae', opacity: '.35' });
  g.appendChild(leaf);

  wrapText(g, 'FOLHA', 0, -8, 15, '#ccff90');
  wrapText(g, 'Angiospermas', 0, 14, 9, '#a5d6a7');
  svg.appendChild(g);
}

function drawMainNode(n, px, py) {
  const g = mkEl('g', { class: 'node-main', cursor: 'pointer' });
  g.addEventListener('click', () => openPanel(n.id));
  drawEdge(0, 0, px, py, 'edge-main');

  g.appendChild(mkEl('circle', { cx: px, cy: py, r: n.r, fill: n.color, stroke: n.stroke, 'stroke-width': '2.5' }));
  const lines = n.label.split('\n');
  lines.forEach((line, i) => {
    const t = mkEl('text', { x: px, y: py + (i - (lines.length - 1) / 2) * 14, fill: '#e8f5e9', 'font-size': 12, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'pointer-events': 'none', 'font-weight': '600' });
    t.textContent = line;
    g.appendChild(t);
  });
  svg.appendChild(g);
}

function drawSubNode(n, px, py, sx, sy) {
  const g = mkEl('g', { class: 'node-sub', cursor: 'pointer' });
  g.addEventListener('click', () => openPanel(n.id));
  drawEdge(px, py, sx, sy, 'edge-sub');

  const rect = mkEl('rect', { x: sx - n.rw, y: sy - n.rh, width: n.rw * 2, height: n.rh * 2, rx: 10, fill: '#1a3d1a', stroke: '#4caf50', 'stroke-width': '1.5' });
  g.appendChild(rect);
  const lines = n.label.split('\n');
  lines.forEach((line, i) => {
    const t = mkEl('text', { x: sx, y: sy + (i - (lines.length - 1) / 2) * 13, fill: '#c8e6c9', 'font-size': 11, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'pointer-events': 'none', 'font-weight': '600' });
    t.textContent = line;
    g.appendChild(t);
  });
  svg.appendChild(g);
}

function drawLeafNode(n, px, py, lx, ly) {
  const g = mkEl('g', { class: 'node-leaf', cursor: 'pointer' });
  g.addEventListener('click', () => openPanel(n.id));
  drawEdge(px, py, lx, ly, 'edge-leaf');

  const rect = mkEl('rect', { x: lx - n.rw, y: ly - n.rh, width: n.rw * 2, height: n.rh * 2, rx: 8, fill: '#0f2710', stroke: '#388e3c', 'stroke-width': '1' });
  g.appendChild(rect);
  const lines = n.label.split('\n');
  lines.forEach((line, i) => {
    const t = mkEl('text', { x: lx, y: ly + (i - (lines.length - 1) / 2) * 12, fill: '#a5d6a7', 'font-size': 10, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'pointer-events': 'none' });
    t.textContent = line;
    g.appendChild(t);
  });
  svg.appendChild(g);
}

/* ── Build ── */
// edges first (insert before everything), then nodes
drawCenterNode();

MAIN_NODES.forEach(n => {
  const {x, y} = mainPositions[n.id];
  drawMainNode(n, x, y);
});

SUB_NODES.forEach(n => {
  const parent = mainPositions[n.parent];
  const {x, y} = subPositions[n.id];
  drawSubNode(n, parent.x, parent.y, x, y);
});

LEAF_NODES.forEach(n => {
  const parent = subPositions[n.parent];
  const {x, y} = leafPositions[n.id];
  drawLeafNode(n, parent.x, parent.y, x, y);
});

/* =========================================================
   PANEL
   ========================================================= */
function openPanel(id) {
  const data = PANELS[id];
  if (!data) return;

  document.getElementById('panel-title').textContent = data.title;
  document.getElementById('panel-text').innerHTML =
    `${data.text}<br><br>${data.tags.map(t => `<span class="tag">${t}</span>`).join('')}`;

  const imgDiv = document.getElementById('panel-img');
  imgDiv.innerHTML = SVGS[data.img] || SVGS['leaf_full'];

  document.getElementById('info-panel').style.display = 'block';
  document.getElementById('overlay').style.display = 'block';
}

function closePanel() {
  document.getElementById('info-panel').style.display = 'none';
  document.getElementById('overlay').style.display = 'none';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

/* =========================================================
   ANIMATED PARTICLES (subtle floating dots)
   ========================================================= */
(function particles(){
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1;opacity:.35';
  document.body.prepend(canvas);
  const ctx = canvas.getContext('2d');
  let pts = [];
  function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    pts = Array.from({length: 60}, () => ({
      x: Math.random()*innerWidth, y: Math.random()*innerHeight,
      r: Math.random()*2+.5, dx: (Math.random()-.5)*.4, dy: (Math.random()-.5)*.4,
      a: Math.random()
    }));
  }
  resize();
  window.addEventListener('resize', resize);
  function frame(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pts.forEach(p=>{
      p.x+=p.dx; p.y+=p.dy;
      if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0;
      if(p.y<0)p.y=canvas.height; if(p.y>canvas.height)p.y=0;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(76,175,80,${p.a})`; ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
